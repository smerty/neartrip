version: '3.8'

# NTRIPS (port 2102) is terminated inside NearTRIP, not by Traefik.
# Traefik only needs 80/443 for the admin UI. Publishers connect to host:2102.
#
# Recommended cert path (no port 443, works without Traefik):
#   cp .env.ntrips.example .env.ntrips   # fill in DNS provider credentials
#   docker network create traefik        # only if the external network is missing
#   docker compose --profile ntrips-dns up -d
# Optional: reuse Traefik's existing LE material instead:
#   docker compose --profile ntrips-traefik up -d
#
# Then add to config.json and restart the core (TLS listen settings are startup-only):
#   "tls": { "port": 2102, "certFile": "/certs/cert.pem", "keyFile": "/certs/key.pem" }

services:
  ntrip:
    image: ghcr.io/smerty/neartrip:latest
    build: .
    ports:
      - "2101:2101"  # Plain NTRIP
      - "2102:2102"  # NTRIPS (TLS); requires tls block in config.json
    environment:
      # Set to the Traefik container IP or a dedicated proxy-only subnet.
      NEARTRIP_TRUSTED_PROXIES: ${NEARTRIP_TRUSTED_PROXIES:-}
      NEARTRIP_SECURE_COOKIES: ${NEARTRIP_SECURE_COOKIES:-true}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - config:/app/config
      - logs:/app/logs
      - ntrip-certs:/certs:ro
    networks:
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=${PUBLIC_HOSTNAME:+true}"
      - "traefik.http.routers.neartrip-ui.rule=Host(`${PUBLIC_HOSTNAME}`)"
      - "traefik.http.routers.neartrip-ui.entrypoints=https"
      - "traefik.http.routers.neartrip-ui.tls.certresolver=myresolver"
      - "traefik.http.services.neartrip-ui.loadbalancer.server.port=3000"  # Admin UI port

  # DNS-01 Let's Encrypt via lego (no HTTP/TLS-ALPN, no port 443).
  # Put provider credentials in .env.ntrips (see .env.ntrips.example); that file is
  # loaded into the container so any lego DNS provider env vars are available.
  ntrips-acme:
    image: brahmadev/acme-lego-cron:latest
    # Provider tokens and lego settings come from this file (see .env.ntrips.example).
    # Do not re-declare DOMAINS/PROVIDER here with empty ${...:-} defaults — that
    # would override env_file and blank out credentials for non-Cloudflare providers.
    env_file:
      - path: .env.ntrips
        required: false
    environment:
      NTRIPS_CERT_DIR: /certs
    volumes:
      - ntrips-acme-data:/letsencrypt
      - ntrip-certs:/certs
      - ./docker/ntrips-publish-certs.sh:/app/hook.sh:ro
    restart: unless-stopped
    profiles:
      - ntrips-dns

  # Optional: export Traefik's existing LE PEMs (same hostname as the UI).
  # dumper writes certs/<domain>.pem + private/<domain>.pem; the publisher
  # copies PUBLIC_HOSTNAME into the fixed cert.pem / key.pem NearTRIP expects.
  certs-dumper:
    image: ldez/traefik-certs-dumper:v2.9.3
    command:
      - file
      - --version=v2
      - --watch
      - --source=/traefik/acme.json
      - --dest=/certs
      - --domain-subdir=false
      - --crt-ext=.pem
      - --key-ext=.pem
    volumes:
      - ${TRAEFIK_ACME_JSON:-./acme.json}:/traefik/acme.json:ro
      - ntrip-certs:/certs
    networks:
      - traefik
    restart: unless-stopped
    profiles:
      - ntrips-traefik

  certs-publish:
    image: alpine:3.20
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      NTRIPS_CERT_DIR: /certs
    volumes:
      - ntrip-certs:/certs
      - ./docker/ntrips-publish-traefik-certs.sh:/publish.sh:ro
    entrypoint: ["/bin/sh", "/publish.sh"]
    restart: unless-stopped
    profiles:
      - ntrips-traefik

volumes:
  config:
  logs:
  ntrip-certs:
  ntrips-acme-data:

networks:
  traefik:
    external: true
