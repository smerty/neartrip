version: '3.8'

services:
  ntrip:
    image: ghcr.io/smerty/neartrip:latest
    build: .
    ports:
      - "2101:2101"  # Direct exposure of NTRIP port
    environment:
      # Set to the Traefik container IP or a dedicated proxy-only subnet.
      NEARTRIP_TRUSTED_PROXIES: ${NEARTRIP_TRUSTED_PROXIES:-}
      NEARTRIP_SECURE_COOKIES: ${NEARTRIP_SECURE_COOKIES:-true}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - config:/app/config
      - logs:/app/logs
    networks:
      - traefik
    restart: unless-stopped
    labels:
      - "traefik.enable=${PUBLIC_HOSTNAME:+true}"
      - "traefik.http.routers.neartrip-ui.rule=Host(`${PUBLIC_HOSTNAME}`)"
      - "traefik.http.routers.neartrip-ui.entrypoints=https"
      - "traefik.http.routers.neartrip-ui.tls.certresolver=myresolver"
      - "traefik.http.services.neartrip-ui.loadbalancer.server.port=3000"  # Admin UI port

volumes:
  config:
  logs:

networks:
  traefik:
    external: true
